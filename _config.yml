title: "ASTRA Framework"
description: "Autonomous System Targeting, Reconnaissance & Attack — A Counter-Autonomy Red Team Methodology"
url: "https://deepwoodssec.github.io"
baseurl: "/astra"
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

aux_links:
  "Deep Woods Security":
    - "https://deepwoodssec.com"

aux_links_new_tab: true

footer_content: "&copy; 2026 Deep Woods Security. ASTRA is an open methodology. Use it. Extend it. Cite it."

nav_sort: case_insensitive

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

color_scheme: dark

defaults:
  - scope:
      path: "docs/methodology"
    values:
      layout: default
      parent: "Methodology"
  - scope:
      path: "docs/techniques"
    values:
      layout: default
      parent: "Techniques"

exclude:
  - README.md
  - LICENSE
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
