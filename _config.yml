title: "ASTRA Framework"
description: "Autonomous System Targeting, Reconnaissance & Attack — A Counter-Autonomy Red Team Methodology"
url: "https://deepwoodssec.github.io"
baseurl: "/astra"
remote_theme: just-the-docs/just-the-docs@v0.10.0

# Branding
aux_links:
  "Deep Woods Security":
    - "https://deepwoodssecurity.com"

aux_links_new_tab: true

logo: "/astra/assets/images/astra-logo.svg"

# Footer
footer_content: "&copy; 2026 Deep Woods Security. ASTRA is an open methodology. Use it. Extend it. Cite it."

# Navigation
nav_sort: case_insensitive

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Color scheme
color_scheme: dark

# Collections for methodology phases and techniques
collections:
  methodology:
    output: true
    permalink: /methodology/:name/
  techniques:
    output: true
    permalink: /techniques/:name/

# Defaults
defaults:
  - scope:
      path: "docs/methodology"
    values:
      layout: default
      parent: "Methodology"
  - scope:
      path: "docs/techniques"
    values:
      layout: default
      parent: "Techniques"

# Exclude from build
exclude:
  - README.md
  - LICENSE
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
